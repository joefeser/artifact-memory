name: Bug report
description: Report reproducible incorrect behavior using synthetic inputs.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: symptom
    attributes:
      label: Observable symptom
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Do not attach private records or artifact bytes.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected contract behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence

