name: Contract or schema work
description: Define or implement bounded protocol behavior.
title: "[Contract] "
labels:
  - contract
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What interoperability or identity problem must be solved?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Contract boundary
      description: What is included and explicitly excluded?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include schemas, fixtures, receipts, and negative cases.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility
      description: Describe sensitivity, authority, versioning, and failure behavior.
    validations:
      required: true

