name: Platform conformance matrix

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run sanitized platform probe
        run: python -c "import json; from artifact_memory.platform_matrix import probe_platform; print(json.dumps(probe_platform(), sort_keys=True))"
      - name: Run conformance tests
        run: python -m unittest discover -s tests -p 'test_platform_matrix.py' -v
