[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artifact-memory"
version = "0.1.0.dev0"
description = "Provider-free reference runtime for portable, verifiable artifact memory"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Joseph Feser"}]
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3"]

[project.scripts]
artifact-memory = "artifact_memory.cli:main"

[tool.setuptools.packages.find]
include = ["artifact_memory*"]
