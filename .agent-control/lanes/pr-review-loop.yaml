agentControl:
  requiredVersion: ">=0.4.1 <0.6.0"
  channel: stable
  allowPrerelease: false
  requiredCapabilities:
    - reviewQuorum
    - requiredReviewerBatching
    - quietJson
    - worktreeCheck
    - onboardDoctor

lane:
  id: artifact-memory-pr-review-loop
  version: 0.1.0
  status: active

description: >
  Contract-first review lane for Artifact Memory. Required reviewer findings
  are processed as a batch; main and release promotion remain human-mediated.

prLoopPacket:
  costProfile: high_assurance
  policyProfile: default
  reviewQuorum:
    enabled: false
    groups:
      trustedCodeReview:
        bots:
          - codex
          - qodo
        minimumReturned: 1
        preferAllReturned: true
        waitForAllTimeoutSeconds: 900
        noneReturnedStopReason: REQUIRED_REVIEW_QUORUM_NOT_MET
  postRequiredReviewMutationPolicy:
    optionalReviewerPatches: owner_decision
  pushPolicy:
    mode: batch_until_review_settles
    localFixesPresent: false
    validationEvidence: []
    findingUrls: []
    waitTimeoutSeconds: 900
  bots:
    codex:
      requirement: required
      waitUntilReturnedBeforeProcessing: true
      waitTimeoutSeconds: 900
      acknowledgedWaitTimeoutSeconds: 900
      requestAllowed: policy
      requestRetryCeiling: 2
      retryCooldownSeconds: 120
    qodo:
      requirement: required
      waitUntilReturnedBeforeProcessing: true
      waitTimeoutSeconds: 1200
      requestAllowed: explicit_only
      requestRetryCeiling: 0
      retryCooldownSeconds: 0
    gemini:
      requirement: disabled
      waitUntilReturnedBeforeProcessing: false
    sourcery:
      requirement: disabled
      waitUntilReturnedBeforeProcessing: false
  branchPolicy:
    overnightAllowedMergeTargets:
      - dev
      - integration/**
    overnightForbiddenMergeTargets:
      - main
      - master
      - release/**
    ownerOverrideEligibleTargets:
      - dev
      - integration/**
    ownerOverrideDeniedTargets:
      - main
      - master
      - release/**
    mainPromotionRequiresSeparatePr: true
    mainPromotionOwnerOnly: true
    mergeMethod: merge_commit
  ownerOverrideAutoMerge:
    enabled: false
    residualRiskCeiling: medium
